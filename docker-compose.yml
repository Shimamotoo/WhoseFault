services:
  postgres:
    image: postgres:16-alpine
    container_name: whosefault-postgres
    restart: unless-stopped
    env_file:
      - ./whosefault-api/.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-whosefault}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - whosefault-network

  api:
    image: shiimamoto/whosefault-api:latest
    container_name: whosefault-api
    restart: unless-stopped
    env_file:
      - ./whosefault-api/.env
    environment:
      - PORT=3333
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-whosefault}?schema=public
      - RUN_MIGRATIONS=true
    ports:
      - "${API_PORT:-3333}:3333"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - whosefault-network

  web:
    image: shiimamoto/whosefault-web:latest
    container_name: whosefault-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - whosefault-network

volumes:
  postgres_data:
    driver: local

networks:
  whosefault-network:
    driver: bridge
